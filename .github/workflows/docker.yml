# VEIL OS — build + publish the Docker image to GHCR.
#
# Runs on every push to main and on demand. Needs BOTH repos to exist on
# GitHub (veil-os and veil-browser-cli) because the Dockerfile builds the
# browser CLI from the sibling repo's source.
#
# Result: ghcr.io/mymaniscr7-sudo/veil-os:latest
#   docker pull ghcr.io/mymaniscr7-sudo/veil-os:latest
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Check out both repos side by side — the build context is the
      # directory that contains them (see docker/Dockerfile).
      - name: Check out veil-os
        uses: actions/checkout@v4
        with:
          path: veil-os

      - name: Check out veil-browser-cli
        uses: actions/checkout@v4
        with:
          repository: mymaniscr7-sudo/veil-browser-cli
          path: veil-browser-cli

      # The build context is the directory holding both repos, so the
      # .dockerignore must sit at the context root — copy the versioned
      # one out of the veil-os repo (single source of truth).
      - name: Place .dockerignore at context root
        run: cp veil-os/.dockerignore .dockerignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: veil-os/docker/Dockerfile
          push: true
          tags: ghcr.io/mymaniscr7-sudo/veil-os:latest
